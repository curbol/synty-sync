    <div class='sky-pilot-search-wrapper'>
      <input type='search' name='customer_products_query_string' value='' placeholder='Search My Products' class='sky-pilot-search-input'>

    </div>

  <div class='sky-pilot-files-list'>
    <div class='sky-pilot-pagination'></div>
