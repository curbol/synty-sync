<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synty-sync · browse</title>
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three/three.module.min.js",
    "three/addons/": "/static/vendor/three/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <h1>synty-sync</h1>
  <input id="q" type="search" placeholder="search assets… (e.g. heart)" autocomplete="off" autofocus>
  <select id="type" title="type"></select>
  <select id="vendor" title="vendor"></select>
  <select id="variant" title="variant"></select>
  <span id="count" class="count"></span>
</header>

<main id="grid"></main>
<div id="sentinel"></div>
<p id="empty" class="empty" hidden>No matching assets.</p>

<div id="lightbox" class="lightbox" hidden>
  <div class="lb-backdrop"></div>
  <div class="lb-panel">
    <button id="lb-close" class="lb-close" title="close (Esc)">✕</button>
    <div id="lb-view" class="lb-view"></div>
    <div class="lb-meta">
      <h2 id="lb-name"></h2>
      <dl id="lb-fields"></dl>
      <div class="lb-copy">
        <code id="lb-path"></code>
        <button id="lb-copybtn">Copy path</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
