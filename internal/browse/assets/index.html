<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synty-sync · browse</title>
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three/three.module.min.js",
    "three/addons/": "/static/vendor/three/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <h1>synty-sync</h1>
  <input id="q" type="search" placeholder="search assets…" autocomplete="off" autofocus>
  <div class="ms" id="type" title="type"><button type="button" class="ms-btn"></button><div class="ms-pop" hidden></div></div>
  <div class="ms" id="vendor" title="vendor"><button type="button" class="ms-btn"></button><div class="ms-pop" hidden></div></div>
  <div class="ms" id="variant" title="variant"><button type="button" class="ms-btn"></button><div class="ms-pop" hidden></div></div>
  <div class="ms tagfilter" id="tagfilter" title="tags" hidden><button type="button" class="ms-btn"></button><div class="ms-pop" hidden></div></div>
  <select id="sort" title="sort order">
    <option value="name">name A–Z</option>
    <option value="path">by pack</option>
  </select>
  <label class="grouptoggle" title="collapse identical copies across variants/packs into one card">
    <input type="checkbox" id="group" checked> group dupes
  </label>
  <span id="count" class="count"></span>
</header>

<main id="grid"></main>
<div id="sentinel"></div>
<p id="empty" class="empty" hidden>No matching assets.</p>

<div id="lightbox" class="lightbox" hidden>
  <div class="lb-backdrop"></div>
  <button id="lb-prev" class="lb-nav lb-nav-prev" title="previous (←)" aria-label="previous">‹</button>
  <button id="lb-next" class="lb-nav lb-nav-next" title="next (→)" aria-label="next">›</button>
  <div class="lb-panel">
    <button id="lb-close" class="lb-close" title="close (Esc)">✕</button>
    <div id="lb-view" class="lb-view"></div>
    <div class="lb-meta">
      <h2 id="lb-name"></h2>
      <dl id="lb-fields"></dl>
      <div id="lb-tags" class="lb-tags" hidden></div>
      <div id="lb-related" class="lb-related" hidden></div>
      <div id="lb-character" class="lb-character"></div>
      <div id="lb-copies" class="lb-copies"></div>
    </div>
  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
