name: Release

on:
  push:
    tags:
      - 'v*'

# Read by default; only the job that publishes the release gets write.
#
# Every action is pinned by commit, not by tag. A tag can be repointed, and the actions
# in the release job run with write access to the repo, publishing the binaries
# `synty-sync update` installs unattended; the ones in the CI job decide whether a build
# ships at all. The comment on each is the readable half; the SHA is the enforced one.
permissions:
  contents: read

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main || {
            echo "Error: tag must point to a commit on main"
            exit 1
          }

  test:
    needs: check-branch
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist

          platforms=(
            "darwin/amd64/mac-intel"
            "darwin/arm64/mac-apple"
            "linux/amd64/linux-intel"
            "linux/arm64/linux-arm64"
            "windows/amd64/win"
          )

          for p in "${platforms[@]}"; do
            IFS='/' read -r goos goarch label <<< "$p"
            bin="synty-sync"
            if [ "$goos" = "windows" ]; then bin="synty-sync.exe"; fi

            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -ldflags "-X main.version=${VERSION}" \
              -o "dist/$bin" .

            # The label is what selfupdate and install.sh match on, and nothing else
            # ties it to the binary inside. Two transposed entries in this array
            # publish, say, arm64 bytes under linux-intel: the label guards compare
            # strings so they pass, the update's magic sniff sees a valid ELF so it
            # passes, and the first user to update replaces their working binary with
            # one their machine cannot run, deleting the only copy that ran. The build
            # stamps the real values into the binary, so ask it rather than trust this
            # array.
            stamped=$(go version -m "dist/$bin")
            for want in "GOOS=$goos" "GOARCH=$goarch"; do
              grep -qE "^[[:space:]]*build[[:space:]]+$want\$" <<< "$stamped" || {
                echo "Error: dist/$bin is not $goos/$goarch, but it is about to ship as $label"
                echo "$stamped"
                exit 1
              }
            done

            # The linker does not fail over an -X it cannot apply, and applies nothing at
            # all to a const, so main.version becoming one ships a whole release of
            # binaries reporting "dev", which `update` then refuses to update from. Only
            # the native build can be run to ask it.
            if [ "$goos/$goarch" = "linux/amd64" ]; then
              reported=$("dist/$bin" version)
              case "$reported" in
                "synty-sync ${VERSION} "*) ;;
                *) echo "Error: the binary reports '$reported', not version ${VERSION}; -X main.version did not apply"; exit 1 ;;
              esac
            fi

            (cd dist && zip "synty-sync-${VERSION}-${label}.zip" "$bin" && rm "$bin")
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: dist/*.zip
          # Publishing a release with no assets would make `update` report "no asset
          # for your platform" to every user while the workflow reported success.
          fail_on_unmatched_files: true
